[package]
name = "skel2d-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Skel2D desktop editor"

[[bin]]
name = "skel2d-editor"
path = "src/main.rs"

[dependencies]
skel2d-core.workspace = true
skel2d-rig.workspace = true
skel2d-render.workspace = true
tiny-skia.workspace = true
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "wgpu", "wayland", "x11", "persistence"] }
rfd = "0.17"
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
winresource = "0.1"
